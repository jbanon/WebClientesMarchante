<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Acceso · Área de clientes (demo) | Marchante PVC</title>
  <meta name="description" content="Demo del área de clientes de Marchante PVC: acceso simulado con datos ficticios.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#17262f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/estilo.css?v=20261001b">
  <link rel="stylesheet" href="/area-clientes/portal.css">
</head>
<body class="portal" data-pagina="acceso">
<main class="p-acceso">
  <section class="p-acceso__form">
    <div>
      <a href="/" aria-label="Marchante PVC, volver a la web"><img class="logo" src="/img/marca/logo-marchante.png" alt="Marchante, sistemas de ventanas" width="352" height="149"></a>
      <p class="sobretitulo">Área de clientes</p>
      <h1>Tus presupuestos y pedidos, <em>al día</em></h1>
      <p>Consulta presupuestos, sigue tus pedidos en fabricación, descarga facturas y abre incidencias.</p>
      <div class="p-aviso p-aviso--info" role="note" style="margin:1.5rem 0 0"><span><strong>Esto es una demo.</strong> Cualquier usuario y contraseña entra. Todos los datos que verás son ficticios.</span></div>
      <form class="formulario" id="f-acceso" action="/area-clientes/inicio/" method="get" autocomplete="off">
        <div class="campo"><label for="usuario">Usuario o correo</label><input id="usuario" name="usuario" type="text" value="demo" autocapitalize="none" spellcheck="false" required></div>
        <div class="campo"><label for="clave">Contraseña</label><input id="clave" name="clave" type="password" value="demo" required></div>
        <div><button class="boton" type="submit">Entrar en la demo</button></div>
      </form>
      <div class="p-acceso__enlaces"><a href="/contacto/?perfil=profesional#presupuesto">¿Aún no eres cliente?</a><a href="/">Volver a la web</a></div>
    </div>
  </section>
  <div class="p-acceso__foto" aria-hidden="true">
    <img src="/img/obras/fachada-antracita-1024.webp" srcset="/img/obras/fachada-antracita-1024.webp 1024w, /img/obras/fachada-antracita-1600.webp 1600w" sizes="60vw" width="1600" height="1063" alt="">
  </div>
</main>
<script src="/area-clientes/portal.js" defer></script>
</body>
</html>
