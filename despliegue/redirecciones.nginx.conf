# Marchante PVC — redirecciones 301 de la web antigua para nginx.
# Generado a partir de web/.htaccess (mantener ambos a la par; referencia: REDIRECCIONES.md).
# Uso: dentro del bloque server { … } del sitio:
#     include /ruta/a/despliegue/redirecciones.nginx.conf;
# y después: sudo nginx -t && sudo systemctl reload nginx

